[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is resolved in migrations/env.py from app settings (DATABASE_URL);
# this value is only a fallback for tooling that reads alembic.ini directly.
sqlalchemy.url = postgresql+psycopg://secureops:secureops@localhost:5432/secureops

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
