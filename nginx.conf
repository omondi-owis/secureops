# =========================================================================
# MlinziOps — example Nginx reverse proxy
# Place in /etc/nginx/sites-available/mlinziops and symlink to sites-enabled.
#
# TLS is intentionally NOT auto-configured with a fake certificate.
# See INSTALLATION.md §"HTTPS" for provisioning a real cert (e.g. Let's Encrypt).
# =========================================================================

# Redirect HTTP -> HTTPS only AFTER you have a real certificate. Keep this
# block commented out until TLS is configured:
#
# server {
#     listen 80;
#     server_name mlinziops.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name mlinziops.example.com;   # change me

    # --- Request size limits (mitigate oversized uploads / DoS) ---------
    client_max_body_size 10m;
    client_body_timeout 12s;
    client_header_timeout 12s;

    # --- Security headers ----------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # --- Static assets served straight from disk ------------------------
    root /opt/mlinziops;
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SSE stream: disable proxy buffering ----------------------------
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else -> Uvicorn -------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
