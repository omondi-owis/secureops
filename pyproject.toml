[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlinziops"
version = "1.0.0"
description = "Self-hosted security operations dashboard for an authorized cybersecurity home lab"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MlinziOps" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1,<4.0",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1.18,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1",
    "PyJWT>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "httpx>=0.27,<1.0",
    "psutil>=5.9,<7.0",
    "python-nmap>=0.7.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "pytest-asyncio>=0.23"]

[project.scripts]
mlinziops = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
